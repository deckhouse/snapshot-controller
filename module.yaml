name: snapshot-controller
stage: "Deprecated"
subsystems:
  - storage
namespace: d8-snapshot-controller
descriptions:
  en: |
    Enables snapshot support for compatible CSI-drivers in the cluster. Deprecated: the
    functionality is provided by the storage-foundation module.
  ru: |
    Включает поддержку снимков для совместимых CSI-драйверов в кластере. Устарел:
    функциональность предоставляет модуль storage-foundation.
requirements:
  deckhouse: ">= 1.72"
  modules:
    # Pin the storage-foundation GA baseline: snapshot support was handed over to it and this
    # deprecated module must not activate before that successor is present at the released version.
    # On a dev build requirements are not enforced anyway; in prod this guarantees storage-foundation
    # v1.0.0+ (the release that ships the byte-for-byte-identical snapshot CRDs) is available.
    storage-foundation: ">= 1.0.0"
accessibility:
  editions:
    _default:
      # Still explicitly enable-able, but no longer auto-enabled in any bundle: new clusters get
      # the functionality from storage-foundation; existing explicit users keep it until they move.
      available: true
