name: snapshot-controller
stage: "General Availability"
subsystems:
  - storage
namespace: d8-snapshot-controller
descriptions:
  en: |
    Enables snapshot support for compatible CSI-drivers in the cluster.
  ru: |
    Включает поддержку снимков для совместимых CSI-драйверов в кластере.
requirements:
  deckhouse: ">= 1.72"
accessibility:
  editions:
    _default:
      # Explicitly enable-able, but intentionally not auto-enabled in any bundle.
      available: true
