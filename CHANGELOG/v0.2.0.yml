Changes:
- The module is deprecated; CSI snapshot support is provided by the storage-foundation module. It is
  no longer auto-enabled in any bundle (still explicitly enable-able). It stays INDEPENDENTLY
  installable: there is no storage-foundation requirement, so a cluster that does not enable
  storage-foundation still gets a working snapshot-controller plus the deprecation alert instead of
  losing snapshot support. Now requires Deckhouse >= 1.76.
- Removed the on-delete hook that stripped finalizers from VolumeSnapshot, VolumeSnapshotContent and
  VolumeSnapshotClass resources when the module was disabled. Disabling the module no longer touches
  these resources, which makes handing snapshot support over to storage-foundation safe. Also removed
  the unused snapshot-validation-webhook certificate hook and its values schema.
- The three snapshot.storage.k8s.io CRDs are shipped as byte-for-byte copies of the
  storage-foundation ones (extended VolumeSnapshot with spec.mode), so both modules can apply the
  identical definitions without conflict. The bundled upstream controller ignores the extra fields
  (spec.mode is defaulted and immutable), so it keeps reconciling snapshots against the extended CRDs.
- Added the D8SnapshotControllerModuleDeprecated alert that fires whenever the module is enabled,
  asking the operator to disable it.
