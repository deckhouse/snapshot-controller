Изменения:
  - Модуль объявлен устаревшим (deprecated); поддержку снимков CSI предоставляет модуль
    storage-foundation. Модуль больше не включается автоматически ни в одном бандле (остаётся
    доступным для явного включения). Он остаётся УСТАНАВЛИВАЕМЫМ НЕЗАВИСИМО: зависимости от
    storage-foundation нет, поэтому кластер, где storage-foundation не включён, всё равно получает
    рабочий snapshot-controller и алерт об устаревании, а не теряет поддержку снимков. Теперь
    требует Deckhouse >= 1.76.
  - Удалён хук, снимавший finalizers с ресурсов VolumeSnapshot, VolumeSnapshotContent и
    VolumeSnapshotClass при выключении модуля. Выключение модуля больше не затрагивает эти ресурсы,
    что делает безопасной передачу поддержки снимков модулю storage-foundation. Также удалён
    неиспользуемый хук сертификата snapshot-validation-webhook и его схема values.
  - Три CRD snapshot.storage.k8s.io поставляются как байт-в-байт копии из storage-foundation
    (расширенный VolumeSnapshot с spec.mode), поэтому оба модуля применяют идентичные определения
    без конфликта. Встроенный upstream-контроллер игнорирует лишние поля (spec.mode имеет значение
    по умолчанию и неизменяемо), поэтому продолжает обслуживать снимки с расширенными CRD.
  - Добавлен алерт D8SnapshotControllerModuleDeprecated, который горит, пока модуль включён, и
    просит оператора выключить его.
