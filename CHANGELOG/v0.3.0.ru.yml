Изменения:
  - CRD snapshot.storage.k8s.io удалены из бандла модуля: теперь ими владеет модуль
    storage-foundation. Deckhouse не удаляет существующие CRD при их исчезновении из бандла,
    поэтому определения продолжает обслуживать storage-foundation. Применять этот релиз только
    после v0.2.0 (в котором поставлялись идентичные копии CRD); не пропускать v0.2.0.
