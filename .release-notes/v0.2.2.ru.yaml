date: "2026-09-14"

summary: "Обслуживающий релиз: модуль пересобран на более новых базовых образах, с более новыми тулчейном Go и Helm-библиотекой; поведение не меняется."

highlights:
  - "Все образы модуля пересобраны на базовых образах v2.1.17 с Go 1.27.1. Поведение модуля, его ресурсы и настройки не меняются."

dependencies:
  - name: базовые образы
    from: "v2.1.7"
    to: "v2.1.17"
    notes: "Пересобирает все образы модуля на актуальных базовых образах."
  - name: Go
    from: "1.27.0"
    to: "1.27.1"
    notes: "Тулчейн, которым собираются контроллер, вебхуки и хуки модуля."
  - name: deckhouse_lib_helm
    from: "1.72.18"
    to: "1.72.22"
    notes: "Helm-библиотека, которой рендерятся шаблоны модуля; сами шаблоны не менялись."

upgrade_notes:
