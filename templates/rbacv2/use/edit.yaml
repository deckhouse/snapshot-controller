{{- if eq (include "snapshot-controller.rbacv2_new_scheme" .) "true" }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.snapshot-controller.edit"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:snapshot-controller:edit
  annotations:
    en.meta.deckhouse.io/title: "Module snapshot-controller: edit"
    ru.meta.deckhouse.io/title: "Модуль snapshot-controller: редактирование"
    en.meta.deckhouse.io/description: "Manage snapshot-controller resources in a namespace."
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля snapshot-controller в пространстве имён."
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
{{- else }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-kubernetes-as: manager
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:snapshot-controller:edit
rules:
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
{{- end }}
