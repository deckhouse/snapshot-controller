{{- if eq (include "snapshot-controller.rbacv2_new_scheme" .) "true" }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.snapshot-controller.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-snapshot-controller
  name: d8:system-capability:snapshot-controller:view
  annotations:
    en.meta.deckhouse.io/title: "Module snapshot-controller: view configuration and cluster resources"
    ru.meta.deckhouse.io/title: "Модуль snapshot-controller: просмотр конфигурации и кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the snapshot-controller module configuration and to the cluster-scoped VolumeSnapshotClass and VolumeSnapshotContent resources."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля snapshot-controller и к кластерным ресурсам VolumeSnapshotClass и VolumeSnapshotContent."
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - snapshot-controller
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- else }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-infrastructure-as: viewer
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-snapshot-controller
  name: d8:manage:permission:module:snapshot-controller:view
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - snapshot-controller
  resources:
  - moduleconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- end }}
