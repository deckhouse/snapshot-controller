{{- if eq (include "snapshot-controller.rbacv2_new_scheme" .) "true" }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.snapshot-controller.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-snapshot-controller
  name: d8:system-capability:snapshot-controller:edit
  annotations:
    en.meta.deckhouse.io/title: "Module snapshot-controller: manage configuration and cluster resources"
    ru.meta.deckhouse.io/title: "Модуль snapshot-controller: управление конфигурацией и кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the snapshot-controller module configuration and the cluster-scoped VolumeSnapshotClass and VolumeSnapshotContent resources."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление конфигурации модуля snapshot-controller и кластерных ресурсов VolumeSnapshotClass и VolumeSnapshotContent."
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - snapshot-controller
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
{{- else }}
{{- if not (.Values.global.enabledModules | has "storage-foundation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  labels:
    heritage: deckhouse
    module: snapshot-controller
    rbac.deckhouse.io/aggregate-to-infrastructure-as: manager
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-snapshot-controller
  name: d8:manage:permission:module:snapshot-controller:edit
rules:
- apiGroups:
  - deckhouse.io
  resourceNames:
  - snapshot-controller
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotclasses
  - volumesnapshotcontents
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}
{{- end }}
