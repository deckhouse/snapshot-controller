{{- /*
  Deprecation alert. Unlike every other template in this module it is NOT wrapped in the
  storage-foundation guard: it must fire whenever the snapshot-controller module is enabled —
  including (especially) when storage-foundation is also enabled and this module already renders
  nothing else — to nudge the operator to disable it. It lives in d8-monitoring (always present),
  not d8-snapshot-controller (that namespace is guarded and absent once storage-foundation is on).
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}-deprecation
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list . (dict "app" "prometheus" "prometheus" "main" "component" "rules")) | nindent 2 }}
spec:
  groups:
    - name: kubernetes.snapshot_controller.deprecation
      rules:
        - alert: D8SnapshotControllerModuleDeprecated
          expr: vector(1)
          labels:
            severity_level: "9"
            tier: cluster
          annotations:
            plk_markup_format: "markdown"
            plk_protocol_version: "1"
            summary: The snapshot-controller module is deprecated and should be disabled.
            description: |
              The `snapshot-controller` module is deprecated. Its functionality (CSI snapshot
              support) is now provided by the `storage-foundation` module.

              Disable the `snapshot-controller` module and enable `storage-foundation` instead:

              ```shell
              kubectl patch moduleconfig snapshot-controller --type merge -p '{"spec":{"enabled":false}}'
              ```

              While `storage-foundation` is enabled, `snapshot-controller` already deploys nothing
              (all its resources are suppressed) and only fires this alert.
